
name: Build MAXIMUS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android source
        run: |
          unzip -q "MAXIMUS_OTC_CAMERA_GOLD_ANDROID_SOURCE(1).zip" -d source
          find source -maxdepth 4 -type f -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: source/MAXIMUS_OTC_CAMERA_GOLD_ANDROID_SOURCE
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAXIMUS-OTC-CAMERA-GOLD-debug-apk
          path: source/MAXIMUS_OTC_CAMERA_GOLD_ANDROID_SOURCE/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
